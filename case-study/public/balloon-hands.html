<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balloon hands</title>
<link rel="preload" as="image" type="image/webp" href="/balloon-hands/fist.webp">
<link rel="preload" as="image" type="image/webp" href="/balloon-hands/open.webp">
<style>
:root{--bg:#F5F5F7;--ink:#0A2FCC}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
.stage{position:relative;width:100%;height:100%;background:var(--bg)}
.stage::after{content:"";position:absolute;top:0;left:0;right:0;height:22vh;z-index:10;pointer-events:none;background:linear-gradient(to bottom,var(--bg) 0%,rgba(245,245,247,0) 100%)}
.hand{position:absolute;bottom:-6vh;height:54vh;aspect-ratio:2/3;transition:transform 1.4s cubic-bezier(.65,0,.35,1),filter 1.4s ease}
.hand.r.drop{transform:translateY(60vh);filter:blur(10px)}
.scene{position:absolute;inset:0;transform:scale(1.12);transform-origin:50% 100%}
.hand.l.center{transform:translate(12vh,5vh) scale(1.08);transform-origin:50% 30%}
.hand.l{left:calc(50% - 30vh)}
.hand.r{left:calc(50% + 2vh)}
.pose{position:absolute;inset:0;z-index:2;-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 60%,transparent 82%);mask-image:linear-gradient(to bottom,#000 0,#000 60%,transparent 82%)}
.hand img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .4s ease,filter .4s ease}
.hand.l img{transform:scaleX(-1)}
.hand img.open{opacity:0;filter:blur(12px);transform:translateX(13%) rotate(-20deg);transform-origin:37% 80%}
.balloon{position:absolute;left:55%;top:30%;height:46vh;aspect-ratio:200/520;z-index:1;transform:translate(-50%,-100%);transition:none}
.hand.l .balloon{left:45%}
.balloon svg{width:100%;height:100%;overflow:visible;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.hand.r .balloon svg{animation-delay:-1.4s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.hand.released .balloon{z-index:3;transform:translate(-50%,-100%) translateY(-120vh) scale(.15);filter:blur(8px);transition:transform 5s cubic-bezier(.45,0,.85,.55),filter 5s cubic-bezier(.45,0,.85,.55)}
.hand.released .balloon svg{animation-duration:1.6s}
</style></head><body>
<div class="stage" id="stage">
  <div class="scene"><div class="hand l" id="left"></div>
  <div class="hand r" id="right"></div></div>
</div>
<script>
const FIST="/balloon-hands/fist.webp",OPEN="/balloon-hands/open.webp",INK="#0A2FCC";
function balloon(fill){return `<div class="balloon"><svg viewBox="0 0 200 520" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
<g stroke="#fff"><path d="M100 252C70 300 130 340 100 390C75 440 120 480 100 520" stroke-width="24"/><path d="M100 8C160 8 192 60 192 118C192 180 140 232 100 236C60 232 8 180 8 118C8 60 40 8 100 8ZM100 238L87 256H113Z" fill="#fff" stroke-width="36"/></g>
<path d="M100 252C70 300 130 340 100 390C75 440 120 480 100 520"/>
<path d="M100 8C160 8 192 60 192 118C192 180 140 232 100 236C60 232 8 180 8 118C8 60 40 8 100 8Z" fill="${fill}"/>
<path d="M100 238L87 256H113Z" fill="${fill}"/>
<path d="M44 96C48 66 68 44 92 36" stroke="#fff" stroke-opacity=".75" stroke-width="9"/></svg></div>`}
function build(el,fill){el.innerHTML=balloon(fill)+`<div class="pose"><img class="fist" src="${FIST}" alt=""><img class="open" src="${OPEN}" alt=""></div>`;el.style.transition="none";el.classList.remove("released","drop","center");void el.offsetWidth;el.style.transition=""}
function morph(el){const f=el.querySelector(".fist"),o=el.querySelector(".open");f.style.opacity=0;f.style.filter="blur(12px)";o.style.opacity=1;o.style.filter="blur(0)"}
const L=document.getElementById("left"),R=document.getElementById("right");let T=[];
const at=(f,ms)=>T.push(setTimeout(f,ms));
function cycle(){at(()=>morph(R),2000);at(()=>R.classList.add("released"),2150);
 at(()=>{R.classList.add("drop");L.classList.add("center")},5600);
 at(()=>{L.classList.remove("center");build(R,"#FFC2D9");R.style.transition="none";R.classList.add("drop");void R.offsetWidth;R.style.transition="";R.classList.remove("drop")},8000);
 at(cycle,9400)}
function play(){T.forEach(clearTimeout);T=[];build(L,"#FFE57A");build(R,"#FFC2D9");cycle()}
play();
</script></body></html>
