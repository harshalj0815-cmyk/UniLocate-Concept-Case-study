<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crowd hero</title>
<style>
:root{color-scheme:light;--bg:#F5F5F7;--fg:#1d1d1f;--muted:#6e6e73;--btn:rgba(0,0,0,.06);--btnh:rgba(0,0,0,.12);
  --d1:saturate(.7) contrast(.6) brightness(1.3);--d2:saturate(.9) contrast(.85) brightness(1.1);--d3:drop-shadow(0 1px 3px rgba(0,0,0,.22));
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--fg:#fff;--muted:#8b8b95;--btn:rgba(255,255,255,.1);--btnh:rgba(255,255,255,.2);--d1:brightness(.5);--d2:brightness(.78);--d3:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--fg:#fff;--muted:#8b8b95;--btn:rgba(255,255,255,.1);--btnh:rgba(255,255,255,.2);--d1:brightness(.5);--d2:brightness(.78);--d3:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:14vh 24px 0;text-align:center}
.hero h1{margin:0;font-size:clamp(34px,6vw,72px);font-weight:700;letter-spacing:-.03em;line-height:1.05;position:relative;z-index:1}
.hero p{margin:18px 0 0;color:var(--muted);font-size:clamp(15px,1.6vw,19px);max-width:560px;position:relative;z-index:1}
.crowd{position:absolute;left:0;right:0;bottom:0;height:min(38vh,340px);pointer-events:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%),linear-gradient(to bottom,#000 0,#000 50%,transparent 100%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%),linear-gradient(to bottom,#000 0,#000 50%,transparent 100%);mask-composite:intersect}
.p{position:absolute;bottom:0;left:0;will-change:transform;transform-origin:50% 100%}
.p img{display:block;height:100%;width:auto;user-select:none;-webkit-user-drag:none}
.l1{filter:blur(3px) var(--d1)}
.l2{filter:blur(1.4px) var(--d2)}
.l3{filter:var(--d3)}
.theme{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:5;width:40px;height:40px;border:0;border-radius:50%;background:var(--btn);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.theme:hover{background:var(--btnh)}
.theme:focus-visible{outline:2px solid #0051F2;outline-offset:2px}
.theme svg{width:20px;height:20px}
.theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:none}
:root[data-theme="dark"] .theme .moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .sun{display:none}:root:not([data-theme="light"]) .theme .moon{display:block}}
</style>
</head>
<body>
<section class="hero">
  <h1>Your headline goes here</h1>
  <p>A supporting line that sits above the crowd.</p>
  <button class="theme" id="theme" type="button" aria-label="Switch between light and dark mode">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <div class="crowd" id="crowd" aria-hidden="true"></div>
</section>
<script>
(function(){
  const root=document.documentElement, mq=matchMedia('(prefers-color-scheme: dark)');
  try{const t=localStorage.getItem('theme'); if(t==='light'||t==='dark') root.dataset.theme=t;}catch(e){}
  document.getElementById('theme').addEventListener('click',()=>{
    const cur=root.dataset.theme||(mq.matches?'dark':'light');
    const next=cur==='dark'?'light':'dark';
    root.dataset.theme=next;
    try{localStorage.setItem('theme',next);}catch(e){}
  });
})();

(function(){
  const crowd=document.getElementById('crowd');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let s=20261124; const rnd=()=>((s=(s*1664525+1013904223)%4294967296)/4294967296);
  let bag=[];
  const pick=()=>{ if(!bag.length){bag=SPRITES.map((_,i)=>i); for(let i=bag.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}} return SPRITES[bag.pop()]; };
  const HIDE=.47;   // fraction of each sprite sunk below the bottom edge, so no legs are ever visible
  // back = small, blurred, dim, slow  ->  front = large, sharp, fast (parallax)
  const LAYERS=[
    {h:.86, blur:3,   dim:.5,  spd:[22,38], z:1, dens:1.15},
    {h:.93, blur:1.4, dim:.78, spd:[34,56], z:2, dens:1},
    {h:1.0, blur:0,   dim:1,   spd:[48,80], z:3, dens:.8}
  ];
  let people=[], W=0, H=0, last=0;
  function reset(p,initial){
    p.dir=rnd()<.5?1:-1;                       // sprites face right, so dir=-1 is mirrored: they always walk the way they face
    p.img.src=pick();
    p.speed=p.L.spd[0]+rnd()*(p.L.spd[1]-p.L.spd[0]);
    p.w=p.el.offsetWidth||80;
    const m=p.w;
    p.x = initial ? -m+rnd()*(W+2*m) : (p.dir>0 ? -m : W+m);
    p.ph=rnd()*6.283; p.bob=2.5+rnd()*2.5;
    p.el.style.bottom=(-p.h*HIDE-rnd()*p.h*.03)+'px';
  }
  function build(){
    crowd.innerHTML=''; people=[]; W=crowd.clientWidth; H=crowd.clientHeight;
    const base=H*1.75, per=Math.max(7,Math.round(W/95));
    LAYERS.forEach(L=>{
      const n=Math.round(per*L.dens);
      for(let i=0;i<n;i++){
        const el=document.createElement('div'); el.className='p';
        const img=new Image(); img.draggable=false; el.appendChild(img);
        const h=base*L.h*(.94+rnd()*.12);
        el.style.height=h+'px'; el.style.zIndex=L.z;
        el.classList.add('l'+L.z);
        crowd.appendChild(el);
        const p={el,img,L,h}; people.push(p);
        img.onload=()=>{p.w=el.offsetWidth};
        reset(p,true);
      }
    });
  }
  function draw(t){
    for(const p of people){
      const stepRate=p.speed*.085;                         // faster walkers take quicker steps
      const bob=Math.abs(Math.sin(t*stepRate+p.ph))*p.bob;
      const lean=p.dir*1.4;
      p.el.style.transform=`translate3d(${(p.x-p.w/2).toFixed(1)}px,${(-bob).toFixed(1)}px,0) rotate(${lean}deg) scaleX(${p.dir})`;
    }
  }
  function step(dt){
    for(const p of people){
      p.x+=p.dir*p.speed*dt;
      p.w=p.el.offsetWidth||p.w;
      if((p.dir>0&&p.x-p.w/2>W+10)||(p.dir<0&&p.x+p.w/2<-10)) reset(p,false);   // left the screen -> a new person enters
    }
  }
  let raf=0,visible=true;
  function loop(now){
    if(!visible){raf=0;last=0;return;}
    const dt=last?Math.min((now-last)/1000,.1):0; last=now;
    step(dt); draw(now/1000); raf=requestAnimationFrame(loop);
  }
  build(); draw(0);
  if(!reduce){ raf=requestAnimationFrame(loop);
    new IntersectionObserver(e=>{visible=e[0].isIntersecting; if(visible&&!raf) raf=requestAnimationFrame(loop);}).observe(crowd);
  }
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{build();draw(0)},200)});
})();
