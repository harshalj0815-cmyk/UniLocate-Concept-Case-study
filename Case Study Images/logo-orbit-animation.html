<title>Logo orbit animation</title>
<style>
:root{--bg:#f4f5f8;--ink:#1d2b45;--surface:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f4f5f8;--ink:#1d2b45;--surface:#fff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
body{overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#stage>*{position:absolute;left:50%;top:50%;will-change:transform,opacity}
#rays{display:block}
.ring{border-radius:50%;border:solid rgba(0,150,255,.2)}
.sticker{display:block;height:auto;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 6px 10px rgba(30,60,120,.18))}
#logo{display:block;height:auto;user-select:none;-webkit-user-drag:none}
#replay{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));top:auto;border:0;border-radius:999px;padding:10px 18px;background:var(--surface);color:var(--ink);font:600 14px/1 system-ui,sans-serif;box-shadow:0 1px 2px rgba(29,43,69,.15),0 6px 16px rgba(29,43,69,.08);cursor:pointer;z-index:20}
#replay:focus-visible{outline:3px solid #3b8de8;outline-offset:3px}
</style>

  var easeOutCubic=function(x){return 1-Math.pow(1-x,3)};
  var easeOutBack=function(x){var c1=1.35,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
  var easeInOut=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
  var smooth=function(x){x=clamp(x);return x*x*(3-2*x)};
  var wrap=function(a){return Math.atan2(Math.sin(a),Math.cos(a))};
  var D2R=Math.PI/180;

  // Measured from the reference: ring radii and sticker widths, in multiples of the logo width L
  var RING=[1.425,2.226];
  var SPEED=[20,11];                 // base orbit speed, deg/s (clockwise)
  var items=[
    {el:$('s-router'),w:.56,ring:0,a:-34, delay:.00},
    {el:$('s-sat'),   w:.90,ring:1,a:-121,delay:.10},
    {el:$('s-aha'),   w:.76,ring:0,a:149, delay:.20},
    {el:$('s-phone'), w:.62,ring:1,a:60,  delay:.30}
  ];
  var logo=$('logo'),rays=$('rays'),rings=[$('ring0'),$('ring1')];
  var L=300;

  // ---- Rays, rebuilt from measurements of the reference ----
  // 1) twelve 15-degree wedges (hard sides) whose reach depends on direction: longest toward upper-left, shortest toward lower-right
  // 2) a soft glow hugging the logo  3) ~112 hairline rays near the logo
  (function paintRays(){
    var D=900,half=D/2,RM=2.8;
    rays.width=rays.height=D;
    var ctx=rays.getContext('2d'),img=ctx.createImageData(D,D),d=img.data;
    for(var y=0;y<D;y++)for(var x=0;x<D;x++){
      var dx=(x+.5-half)/half*RM,dy=(y+.5-half)/half*RM,r=Math.sqrt(dx*dx+dy*dy);
      if(r>2.78)continue;
      var th=Math.atan2(dy,dx),rr=Math.max(r,.6);
      var m=((th/D2R+7.5)%30+30)%30;
      var lam=.75+.3*Math.cos(th-225*D2R);
      var w=(m<15&&r<2.7)?.14*Math.exp(-(rr-.7)/lam):0;
      var g=.095*Math.exp(-(rr-.7)/.4)*(1-smooth((r-1.3)/.4));
      var f=.02*Math.exp(-(rr-.7)/.6)*Math.tanh(3*Math.sin(112*th));
      var a=Math.max(0,Math.min(.5,w+g+f)),i=(y*D+x)*4;
      d[i+1]=150;d[i+2]=255;d[i+3]=Math.round(a*255);
    }
    ctx.putImageData(img,0,0);
  })();

  function layout(){
    L=Math.min(innerWidth*.15,innerHeight*.17);
    logo.style.width=L+'px';
    rays.style.width=rays.style.height=(L*5.6)+'px';
    rings.forEach(function(r,i){var dd=RING[i]*2*L;r.style.width=r.style.height=dd+'px';r.style.borderWidth=Math.max(1.5,L*.0127)+'px'});
    items.forEach(function(it){it.el.style.width=(it.w*L)+'px'});
  }
  function place(el,x,y,s,rot,op){
    el.style.transform='translate(-50%,-50%) translate('+x.toFixed(2)+'px,'+y.toFixed(2)+'px) rotate('+rot.toFixed(2)+'deg) scale('+s.toFixed(4)+')';
    el.style.opacity=op;
  }

  // ---- Orbit with inertia ----
  // Each sticker is a mass on an elastic tether to its slot on the ring. Every few seconds the orbit surges and brakes;
  // the sticker's angular momentum flings it outward, then the tether pulls it back onto the ring.
  var KR=16,CR=2.8,KT=30,CT=5,SURGE_AT=3.6,SURGE_EVERY=6;
  function surge(t){
    if(t<SURGE_AT)return 0;
    var u=(t-SURGE_AT)%SURGE_EVERY;
    if(u<.7)return 4*smooth(u/.7);
    if(u<1)return 4*(1-smooth((u-.7)/.3));
    return 0;
  }
  var mult=function(t){return smooth((t-1.3)/2.2)*(1+surge(t))};
  function anchor(it,t,s,m){
    var q=clamp((t-.6-it.delay)/1.25),e=easeOutCubic(q);
    var dedt=q>0&&q<1?3*Math.pow(1-q,2)/1.25:0;
    return{q:q,e:e,R:RING[it.ring]*e,vR:RING[it.ring]*dedt,
      th:(it.a-(1-e)*60+SPEED[it.ring]*s)*D2R,
      w:SPEED[it.ring]*m*D2R+60*D2R*dedt};
  }
  function step(it,t,s,m,h){
    var A=anchor(it,t,s,m);
    if(A.q<=0){it.r=0;it.vr=0;it.th=A.th;it.vth=A.w;return}
    var cf=smooth((t-2.2)/.8),r=Math.max(it.r,.04);
    var ar=cf*r*it.vth*it.vth-KR*(it.r-A.R)+CR*(A.vR-it.vr);
    var at=-2*it.vr*it.vth/r+KT*wrap(A.th-it.th)+CT*(A.w-it.vth);
    it.vr+=ar*h;it.r+=it.vr*h;it.vth+=at*h;it.th+=it.vth*h;
  }

  var t=0,s=0;
  function render(){
    var k=easeInOut(clamp((t-.7)/1.7));
    var pulse=.05*Math.sin(Math.PI*clamp((t-.55)/.6));
    logo.style.transform='translate(-50%,-50%) scale('+(1+pulse).toFixed(4)+')';
    logo.style.filter='grayscale('+k.toFixed(3)+') brightness('+(1+.1*k).toFixed(3)+') drop-shadow(0 '+(L*.03)+'px '+(L*.07)+'px rgba(30,40,70,'+(.18+.07*k).toFixed(2)+'))';

    var g=easeOutCubic(clamp((t-.7)/1.6));
    place(rays,0,0,.6+.4*g,0,g);
    rings.forEach(function(r,i){
      var q=easeOutCubic(clamp((t-.8-i*.18)/1.1));
      place(r,0,0,.35+.65*q,0,q);
    });

    var m=mult(t);
    items.forEach(function(it){
      var A=anchor(it,t,s,m),p=easeOutBack(A.q);
      var lag=Math.max(-12,Math.min(12,wrap(A.th-it.th)/D2R*.5));
      var rot=-(1-A.e)*40+lag;
      place(it.el,Math.cos(it.th)*it.r*L,Math.sin(it.th)*it.r*L,Math.max(.3+.7*p,.05),rot,A.q>0?1:0);
    });
  }

  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf=0,last=0;
  function reset(){t=0;s=0;items.forEach(function(it){it.r=0;it.vr=0;it.th=it.a*D2R;it.vth=0})}
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    var n=Math.max(1,Math.ceil(dt*120)),h=dt/n;
    for(var i=0;i<n;i++){
      t+=h;var m=mult(t);s+=m*h;
      items.forEach(function(it){step(it,t,s,m,h)});
    }
    render();
    raf=requestAnimationFrame(frame);
  }
  function settled(){ // reduced motion: show the finished composition, no movement
    t=10;s=0;items.forEach(function(it){var A=anchor(it,t,0,0);it.r=A.R;it.th=A.th});render();
  }
  function start(){
    cancelAnimationFrame(raf);reset();
    if(reduce){settled();return}
    render();
    raf=requestAnimationFrame(function(now){last=now;frame(now)});
  }
  layout();start();
  addEventListener('resize',function(){layout();if(reduce)settled()});
  $('replay').addEventListener('click',start);
  if(reduce)$('replay').style.display='none';
})();
</script>
</body>
</html>
