<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Interview response bubble</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600&display=swap">
<style>
:root{color-scheme:light only;--page:#fff;--ink:#111;--paper:#fff;--muted:#555;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-weight:600;color:var(--ink);padding:24px 16px}
.iv{width:100%;max-width:720px}
.stage{color:var(--ink);padding:0}
.bubble{position:relative;border:3px solid var(--ink);border-radius:26px;padding:20px 24px 18px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);margin:0 auto 34px;max-width:480px;min-height:132px;left:var(--shift,0px)}
.bubble::before,.bubble::after{content:"";position:absolute;left:var(--tail,50%);width:0;height:0;border-style:solid;transform:translateX(-50%)}
.bubble::before{bottom:-30px;border-width:30px 16px 0;border-color:var(--ink) transparent transparent}
.bubble::after{bottom:-23px;border-width:25px 12px 0;border-color:var(--paper) transparent transparent}
.quote{font-size:clamp(19px,3.2vw,24px);line-height:1.35;margin:0;text-wrap:pretty}
.group{display:flex;justify-content:center;align-items:flex-end;margin-bottom:-2px;-webkit-mask-image:linear-gradient(to bottom,#000 65%,transparent 100%);mask-image:linear-gradient(to bottom,#000 65%,transparent 100%)}
.group img{display:block;width:25%;height:auto;margin:0 -2.5%;position:relative;top:0;transition:top .25s ease}

.group img:nth-child(n+2){transform:scaleX(-1)}
.dots{display:flex;justify-content:center;gap:10px;margin:14px 0 0}
.dot{all:unset;cursor:pointer;width:14px;height:14px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper)}
.dot[aria-current="true"]{background:var(--ink)}
.dot:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.quote{transition:opacity .25s ease}
.quote.out{opacity:0}
.bubble{transform-origin:var(--tail,50%) 100%;transition:opacity .2s ease,transform .3s cubic-bezier(.3,1.5,.5,1)}
.bubble.out{opacity:0;transform:scale(.5)}
@media (prefers-reduced-motion:reduce){.bubble,.quote{transition:none}}.group img.crowd{width:min(100%,640px);margin:0;transform:none}
.bubble{border-color:var(--bc,var(--ink));box-shadow:4px 4px 0 var(--bc,var(--ink))}
.bubble::before{border-top-color:var(--bc,var(--ink))}
.bubble{display:flex;align-items:center}.quote{flex:1}
</style>
</head>

<script>
// Edit this list: each entry is one interview response shown in the group bubble.
var RESPONSES=[
  "I usually check the schedule on the bus, but it never loads when the signal drops.",
  "Honestly I just ask a friend. It’s faster than digging through the app.",
  "I’d use it more if it remembered what I looked at last time.",
  "I don’t trust the arrival times. They’re wrong about half the time.",
  "Notifications are the only reason I open it. Otherwise I forget it exists.",
  "I wish I could save my usual route instead of typing it in every morning.",
  "The map is nice, but I get lost in all the menus when I’m in a hurry.",
  "When I’m running late I need one answer fast, not five options.",
  "My parents check it for me, so I never really learned how it works."
];
var INTERVAL=4500,q=document.getElementById("quote"),dotsEl=document.getElementById("dots"),i=0,timer,dots=[];

function show(n){
  i=n;var bub=document.getElementById("bubble");bub.classList.add("out");
  setTimeout(function(){q.textContent="“"+RESPONSES[i]+"”";moveTail(speaker());bub.classList.remove("out");
    dots.forEach(function(d,k){d.setAttribute("aria-current",k===i?"true":"false")})},q.dataset.ready?250:0);
  q.dataset.ready=1;
}
var lastK=-1;
function speaker(){var k=Math.floor(Math.random()*5);lastK=k;return k}
function next(){var n;do{n=Math.floor(Math.random()*RESPONSES.length)}while(n===i);return n}
var HEADS=[0.175, 0.339, 0.521, 0.7, 0.833],COLORS=["#0051F2","#E0206A","#0E8F6B","#E8A200","#F26A0F"];
function moveTail(k){
  var img=document.querySelector(".group img"),bub=document.getElementById("bubble"),bw=bub.offsetWidth,s=document.querySelector(".stage").getBoundingClientRect(),r=img.getBoundingClientRect(),c=r.left+r.width*HEADS[k]-s.left,x=Math.max(40,Math.min(bw-40,c-(s.width-bw)/2));
  bub.style.setProperty("--tail",x+"px");bub.style.setProperty("--bc",COLORS[k]);
}
function restart(){clearInterval(timer);timer=setInterval(function(){show(next())},INTERVAL)}
var stage=document.querySelector(".stage");


show(0);restart();function fit(){var b=document.getElementById("bubble"),cur=q.textContent,m=0;b.style.minHeight="0";RESPONSES.forEach(function(t){q.textContent="“"+t+"”";m=Math.max(m,b.offsetHeight)});q.textContent=cur;b.style.minHeight=m+"px"}
window.addEventListener("resize",function(){fit();moveTail(lastK)});window.addEventListener("load",function(){fit();moveTail(lastK)});if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){fit();moveTail(lastK)})}
</script>
