<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus sticker burst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:transparent}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;position:relative;overflow:hidden;background:transparent}
canvas{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block}
#replay,#sound{position:absolute;z-index:2;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(20,30,80,.2);background:rgba(20,30,80,.05);color:#1b2a6b;display:grid;place-items:center;cursor:pointer;padding:0;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease}
#replay:active,#sound:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){#replay:hover,#sound:hover{background:rgba(20,30,80,.12)}}
@media (prefers-reduced-motion:reduce){#replay:active,#sound:active{transform:none}}
#replay:focus-visible,#sound:focus-visible{outline:2px solid #2f6bff;outline-offset:3px}
#replay svg,#sound svg{width:20px;height:20px}
#sound{right:68px}
#msg{position:absolute;z-index:0;left:50%;top:43%;width:min(88%,640px);text-align:center;pointer-events:none;opacity:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;transform:translate(-50%,-50%)}
#msg h1{white-space:nowrap;margin:0;font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.15;letter-spacing:-.02em;color:#2C2C2C}
#msg p{white-space:nowrap;margin:6px 0 0;font-weight:500;font-size:clamp(13px,3vw,16px);line-height:1.35;color:#2C2C2C}
html.ul-embed #replay,html.ul-embed #sound{display:none!important}
html.ul-embed,html.ul-embed body{background:transparent!important}
html.ul-embed #msg{top:30%;width:min(90%,300px)!important}
html.ul-embed #msg h1{font-size:28px!important;font-weight:700!important;line-height:34px!important;letter-spacing:-.02em}
html.ul-embed #msg p{font-size:14px!important;font-weight:600!important;line-height:18px!important;letter-spacing:-.02em;max-width:280px;margin:6px auto 0;overflow:hidden;text-overflow:ellipsis}
</style>

  }
  loopOn=!reduced&&!embed;playing=true;last=performance.now();
  /* Unlock + fade as the pile begins — don't wait for the first hit */
  unlock();
  requestAnimationFrame(()=>{unlock();sfxIntro();if(hits===0&&!rum&&!calm)startRumble()});
  raf=requestAnimationFrame(frame);
}

for(let q=0;q<4;q++)for(const col of PAL)for(let l=0;l<4;l++)confSprite(q,col,l);
resize();start(false);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitText);
let rt=0;
new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{
  const b=document.body;
  if(Math.abs(b.clientWidth-W)<2&&Math.abs(b.clientHeight-H)<80)return;
  resize();
  /* Embed: card grow resizes the iframe — redraw only, never replay */
  if(embed){if(calm)drawCalm();else draw();return}
  start(false);
},150)}).observe(document.body);
document.getElementById('replay').addEventListener('click',()=>{unlock();start(true)});
const snd=document.getElementById('sound'),swP=document.getElementById('sw');
snd.addEventListener('click',()=>{
  muted=!muted;unlock();ac();
  if(master){
    if(muted){master.gain.cancelScheduledValues(AC.currentTime);master.gain.value=0}
    else fadeMasterIn();
  }
  snd.setAttribute('aria-label',muted?'Unmute sound':'Mute sound');
  swP.setAttribute('d',muted?'m16 9 5 6m0-6-5 6':'M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13');
});
document.addEventListener('pointerdown',unlock);document.addEventListener('keydown',unlock);
/* Parent shell unlocks after arrival — iframe autoplay is often suspended */
window.addEventListener('message',(e)=>{
  const d=e.data;if(!d||d.type!=='burst-unlock')return;
  unlock();sfxIntro();
});
})();
</script>
